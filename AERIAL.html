<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERIAL — SPLAT Video Store</title>
 
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    :root {
      --white: #ffffff;
      --black: #111111;
      --green: #7ec98f;
      --green-dark: #5db570;
      --green-light: #e8f7eb;
      --gray: #f5f5f5;
      --gray-mid: #e0e0e0;
      --gray-text: #888;
      --font: 'Arial', sans-serif;
    }
 
    body {
      font-family: var(--font);
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
    }
 
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1.5px solid var(--black);
      padding: 0 48px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
 
    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--black);
      text-decoration: none;
    }
 
    .logo span { color: var(--green); }
 
    nav {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--gray-text);
    }
 
    /* ========== MODEL PROFILE ========== */
    .model-profile {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 48px 32px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
 
    .model-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--green);
      flex-shrink: 0;
      display: block;
    }
 
    .model-info {}
 
    .model-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--black);
      line-height: 1.1;
      margin-bottom: 6px;
    }
 
    .model-count {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray-text);
      font-weight: 400;
    }
 
    .profile-divider {
      max-width: 1100px;
      margin: 0 auto 0;
      border: none;
      border-top: 1.5px solid var(--black);
    }
 
    .videos {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 48px 80px;
    }
 
    .videos h2 {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gray-text);
      margin-bottom: 24px;
      font-weight: 700;
    }
 
    .vid-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
 
    .vid-card {
      display: block;
      text-decoration: none;
      border: 1px solid var(--gray-mid);
      border-radius: 6px;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.18s;
    }
 
    .vid-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
 
    .vid-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: var(--gray);
    }
 
    .vid-info { padding: 10px 12px 12px; }
 
    .vid-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
 
    .vid-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--green-dark);
    }
    @media (max-width: 900px) {
      .vid-grid { grid-template-columns: repeat(2, 1fr); }
    }
 
    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .model-profile { padding: 32px 20px 24px; }
      .videos { padding: 24px 20px 60px; }
      .vid-grid { grid-template-columns: repeat(2, 1fr); }
      .model-avatar { width: 68px; height: 68px; }
      .model-name { font-size: 20px; }
    }
  </style>
</head>
 
<body>
 
<header>
  <a class="logo" href="index.html">SPLAT<span>Challenges</span></a>
  <nav>Video Store</nav>
</header>
 
<!-- Model Profile -->
<div class="model-profile">
  <img class="model-avatar" src="https://i.ibb.co/KxK3n6T3/AERIAL1-img1.jpg" alt="AERIAL" />
  <div class="model-info">
    <div class="model-name">Aerial</div>
    <div class="model-count">1 video</div>
  </div>
</div>
<hr class="profile-divider" />
 
<div class="videos">
  <h2>Videos</h2>
 
  <div class="vid-grid">
    <a class="vid-card" href="AE01.html">
      <img class="vid-thumb" src="https://i.ibb.co/N6Mhhc4B/AERIAL1-img2.jpg" alt="AERIAL 1" />
      <div class="vid-info">
        <div class="vid-title">AERIAL 1. SPLAT SPA SALON</div>
        <div class="vid-price">$10 USD</div>
      </div>
    </a>
  </div>
</div>
 
</body>
</html>
</html>
